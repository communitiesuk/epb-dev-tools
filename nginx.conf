resolver 127.0.0.11;
server_tokens off;
server_names_hash_bucket_size 128;

server {
  listen 80 default_server;
  server_name _;

  return 404;
}

server {
  listen 80;
  server_name getting-new-energy-certificate.epb-frontend.localhost find-energy-certificate.epb-frontend.localhost epb-frontend.localhost;

  location / {
    include /etc/nginx/mime.types;
    proxy_pass_header Authorization;
    proxy_pass http://epb-frontend/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 36000s;
    proxy_redirect off;
  }
}

server {
  listen 80;
  server_name epb-data-frontend.localhost;

  location / {
    include /etc/nginx/mime.types;
    proxy_pass_header Authorization;
    proxy_pass http://epb-data-frontend/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 36000s;
    proxy_redirect off;
  }
}

server {
  listen 80;
  server_name epb-register-api.localhost;

  location /test_files {
    alias /var/www/http_files;
    add_header Cross-Origin-Resource-Policy "same-origin";
    add_header X-Content-Type-Options "nosniff";
  }

  location /auth/ {
    proxy_pass_header Authorization;
    proxy_pass http://epb-auth-server/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 36000s;
    proxy_redirect off;
  }

  location / {
    proxy_pass_header Authorization;
    proxy_pass http://epb-register-api/;
